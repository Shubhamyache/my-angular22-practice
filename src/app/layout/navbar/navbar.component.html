<!--
  TOP NAVBAR
  ────────────────────────────────────────────────────────────────────────
  z-index: 1030 → sits above sidebar overlay (1025) and backdrop (1020)
-->
<nav class="navbar bg-dark sticky-top shadow-sm" style="height:56px; z-index:1030;">
  <div class="container-fluid px-3 gap-0">

    <!-- ──────────────────── LEFT SECTION ───────────────────── -->
    <div class="d-flex align-items-center gap-2 flex-shrink-0">

      <!-- Hamburger / sidebar toggle -->
      <!--
        This button calls toggleMenu() which emits (menuToggled)
        to ShellComponent, which then flips sidebarOpen signal.
        The icon changes to reflect sidebar state.
      -->
      <button
        class="btn btn-link text-secondary p-1 lh-1"
        (click)="toggleMenu()"
        [title]="sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'">
        <i [class]="'bi fs-4 ' + (sidebarOpen() ? 'bi-layout-sidebar' : 'bi-layout-sidebar-inset')"></i>
      </button>

      <!-- Brand logo + name -->
      <a
        class="text-white text-decoration-none d-flex align-items-center gap-2"
        routerLink="/dashboard">
        <div
          class="bg-primary rounded d-flex align-items-center justify-content-center"
          style="width:30px;height:30px;flex-shrink:0;">
          <i class="bi bi-building-fill-gear text-white" style="font-size:0.85rem;"></i>
        </div>
        <span class="fw-bold d-none d-sm-inline" style="font-size:1rem;">EMS</span>
      </a>

      <!-- Breadcrumb: current page title (desktop only) -->
      <!--
        pageTitle is passed down from ShellComponent as a signal input.
        ShellComponent reads it from the activated route's data.title.
      -->
      <div class="d-none d-lg-flex align-items-center gap-1 text-secondary ms-1">
        <i class="bi bi-chevron-right" style="font-size:0.7rem;"></i>
        <i [class]="'bi ' + pageIcon() + ' text-primary'" style="font-size:0.8rem;"></i>
        <span class="text-white-50 fw-medium" style="font-size:0.85rem;">{{ pageTitle() }}</span>
      </div>
    </div>

    <!-- ────────────────── CENTER SEARCH (desktop) ─────────────────── -->
    @if (searchOpen()) {
      <div class="flex-grow-1 mx-4 d-none d-md-block">
        <app-global-search />
      </div>
    }

    <!-- ──────────────────── RIGHT SECTION ──────────────────── -->
    <div class="d-flex align-items-center gap-1 ms-auto">

      <!-- Search toggle button (desktop) -->
      <button
        class="btn btn-link p-1 lh-1 d-none d-md-inline-flex"
        [class.text-primary]="searchOpen()"
        [class.text-secondary]="!searchOpen()"
        (click)="toggleSearch()"
        title="Search">
        <i class="bi bi-search fs-5"></i>
      </button>

      <!-- Notification bell with real unread-count + dropdown panel -->
      <app-notification-bell />

      <!--
        Profile menu — avatar (photo or FirstName+LastName initials) + name/role, opens a
        dropdown with Settings and Logout. Its own component (mirrors NotificationBellComponent's
        self-contained click-outside-to-close pattern) so the navbar doesn't need to own that
        open/close state or Logout's HTTP call itself.
      -->
      <app-profile-menu />

    </div>
  </div>
</nav>
