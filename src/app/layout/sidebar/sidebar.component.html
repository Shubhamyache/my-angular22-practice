<aside [class.sidebar-collapsed]="!isOpen()" class="sidebar d-flex flex-column py-3">
  @if (isOpen()) {
    <div class="px-3 mb-2">
      <small class="text-uppercase fw-bold" style="color: rgba(255,255,255,0.35); font-size: 0.7rem; letter-spacing: 0.1em;">
        Main Menu
      </small>
    </div>
  }

  <nav class="flex-grow-1">
    <ul class="nav flex-column gap-1 px-2">
      @for (item of navItems; track item.route) {
        <li class="nav-item">
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-link sidebar-nav-link d-flex align-items-center gap-2 py-2 px-2 rounded">
            <i [class]="'bi ' + item.icon + ' fs-5 flex-shrink-0'"></i>
            @if (isOpen()) {
              <span class="text-truncate">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  @if (isOpen()) {
    <div class="px-3 mt-auto pt-3 border-top border-secondary border-opacity-25">
      <small class="text-secondary" style="font-size: 0.7rem;">Angular 22 + .NET 10</small>
    </div>
  }
</aside>
