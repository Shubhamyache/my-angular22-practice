<div class="container-fluid py-2">

  <!-- Page Header -->
  <div class="mb-4">
    <h2 class="fw-bold mb-0">
      <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard
    </h2>
    <p class="text-muted mb-0 small">
      Welcome back, <strong>{{ authService.getUserName() || 'Administrator' }}</strong>
    </p>
  </div>

  <!-- KPI Stats Row -->
  <div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-xl-3">
      <app-stats-card
        label="Total Employees"
        [value]="stats().totalEmployees"
        icon="bi-people-fill"
        color="primary"
        [change]="5.2" />
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <app-stats-card
        label="Departments"
        [value]="stats().activeDepartments"
        icon="bi-diagram-3-fill"
        color="success"
        [change]="0" />
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <app-stats-card
        label="Monthly Payroll"
        [value]="stats().monthlyPayrollLabel"
        icon="bi-cash-coin"
        color="warning"
        [change]="-2.1" />
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <app-stats-card
        label="Open Positions"
        [value]="stats().openPositions"
        icon="bi-briefcase-fill"
        color="danger"
        [change]="null" />
    </div>
  </div>

  <!-- Charts Row -->
  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <app-chart title="Employee Headcount — Last 12 Months" />
    </div>
    <div class="col-12 col-lg-4">
      <app-chart title="Headcount by Department" />
    </div>
  </div>

</div>
