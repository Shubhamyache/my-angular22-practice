<app-modal [title]="reportName()" size="xl" (closed)="close()">

  @if (downloadError()) {
    <div class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 py-2 small">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <span>{{ downloadError() }}</span>
      <button type="button" class="btn-close ms-auto" (click)="downloadError.set(null)"></button>
    </div>
  }

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted small mt-2 mb-0">Loading preview…</p>
    </div>
  } @else if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else {
    <app-table
      [columns]="columns()"
      [rows]="pagedRows()"
      emptyMessage="This report has no data to preview." />

    @if (totalRows() > pageSize()) {
      <div class="mt-3">
        <app-pagination
          [currentPage]="currentPage()"
          [totalItems]="totalRows()"
          [pageSize]="pageSize()"
          (pageChange)="onPageChange($event)" />
      </div>
    }
  }

  <div modal-footer class="d-flex gap-2">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="close()">Cancel</button>
    <button
      type="button"
      class="btn btn-outline-info btn-sm"
      [disabled]="loading() || !!error() || !!downloadingFormat()"
      (click)="download('Pdf')">
      @if (downloadingFormat() === 'Pdf') {
        <span class="spinner-border spinner-border-sm me-2"></span>
      } @else {
        <i class="bi bi-file-earmark-pdf me-1"></i>
      }
      Download PDF
    </button>
    <button
      type="button"
      class="btn btn-primary btn-sm"
      [disabled]="loading() || !!error() || !!downloadingFormat()"
      (click)="download('Xlsx')">
      @if (downloadingFormat() === 'Xlsx') {
        <span class="spinner-border spinner-border-sm me-2"></span>
      } @else {
        <i class="bi bi-file-earmark-excel me-1"></i>
      }
      Download Excel (.xlsx)
    </button>
  </div>

</app-modal>
