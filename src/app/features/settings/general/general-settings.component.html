<h5 class="fw-bold mb-1">General Settings</h5>
<p class="text-muted small mb-3">Configure application-wide preferences</p>

@if (!canEdit) {
  <div class="alert alert-secondary d-flex align-items-center gap-2 py-2 mb-4">
    <i class="bi bi-eye flex-shrink-0"></i>
    <small>Read-only — only Admins can change these settings.</small>
  </div>
}

@if (saved()) {
  <div class="alert alert-success py-2 small">
    <i class="bi bi-check-circle-fill me-2"></i>Settings saved.
  </div>
}
@if (error()) {
  <div class="alert alert-danger alert-dismissible py-2 small">
    {{ error() }}
    <button type="button" class="btn-close" (click)="error.set(null)"></button>
  </div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label class="form-label fw-semibold small">Application Name</label>
    <input formControlName="appName" type="text" class="form-control" />
  </div>
  <div class="mb-3">
    <label class="form-label fw-semibold small">Default Timezone</label>
    <select formControlName="timezone" class="form-select">
      <option value="UTC">UTC</option>
      <option value="America/New_York">Eastern Time</option>
      <option value="America/Chicago">Central Time</option>
      <option value="America/Los_Angeles">Pacific Time</option>
      <option value="Europe/London">London</option>
      <option value="Europe/Paris">Paris</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label fw-semibold small">Date Format</label>
    <select formControlName="dateFormat" class="form-select">
      <option value="MM/DD/YYYY">MM/DD/YYYY</option>
      <option value="DD/MM/YYYY">DD/MM/YYYY</option>
      <option value="YYYY-MM-DD">YYYY-MM-DD (ISO)</option>
    </select>
  </div>
  <div class="mb-4">
    <label class="form-label fw-semibold small">Items per Page</label>
    <select formControlName="pageSize" class="form-select">
      <option [value]="10">10</option>
      <option [value]="20">20</option>
      <option [value]="50">50</option>
      <option [value]="100">100</option>
    </select>
  </div>
  @if (canEdit) {
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving() || loading()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-2"></span>Saving...
        } @else {
          Save Changes
        }
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="onResetDefaults()">Reset Defaults</button>
    </div>
  }
</form>
