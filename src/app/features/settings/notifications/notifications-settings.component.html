<h5 class="fw-bold mb-1">Notification Preferences</h5>
<p class="text-muted small mb-3">Choose what you want to be notified about</p>

@if (error()) {
  <div class="alert alert-danger alert-dismissible py-2 small">
    {{ error() }}
    <button type="button" class="btn-close" (click)="error.set(null)"></button>
  </div>
}

@if (saved()) {
  <div class="alert alert-success py-2 small">
    <i class="bi bi-check-circle-fill me-2"></i>Preferences saved.
  </div>
}

<div class="table-responsive">
  <table class="table align-middle">
    <thead class="table-light">
      <tr>
        <th>Event</th>
        <th class="text-center">Email</th>
        <th class="text-center">In-App</th>
      </tr>
    </thead>
    <tbody>
      @for (pref of prefs(); track pref.id) {
        <tr>
          <td>
            <div class="fw-semibold small">{{ pref.label }}</div>
            <small class="text-muted">{{ pref.detail }}</small>
          </td>
          <td class="text-center">
            <div class="form-check d-flex justify-content-center">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="pref.email"
                (change)="toggle(pref.id, 'email')" />
            </div>
          </td>
          <td class="text-center">
            <div class="form-check d-flex justify-content-center">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="pref.inApp"
                (change)="toggle(pref.id, 'inApp')" />
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<button class="btn btn-primary mt-2" [disabled]="saving()" (click)="save()">
  @if (saving()) {
    <span class="spinner-border spinner-border-sm me-2"></span>Saving...
  } @else {
    Save Preferences
  }
</button>
