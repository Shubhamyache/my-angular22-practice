<h5 class="fw-bold mb-1">Notification Preferences</h5>
<p class="text-muted small mb-3">Choose what you want to be notified about</p>

<!-- No /users/me/notification-preferences endpoint exists yet (UIIntegrationInfo.md §18). -->
<div class="alert alert-secondary d-flex align-items-center gap-2 py-2 mb-4">
  <i class="bi bi-tools flex-shrink-0"></i>
  <small>Not yet connected to a backend — changes here aren't saved. See UIIntegrationInfo.md §18.</small>
</div>

<div class="table-responsive">
  <table class="table align-middle">
    <thead class="table-light">
      <tr>
        <th>Event</th>
        <th class="text-center">Email</th>
        <th class="text-center">In-App</th>
      </tr>
    </thead>
    <tbody>
      @for (pref of prefs(); track pref.id) {
        <tr>
          <td>
            <div class="fw-semibold small">{{ pref.label }}</div>
            <small class="text-muted">{{ pref.detail }}</small>
          </td>
          <td class="text-center">
            <div class="form-check d-flex justify-content-center">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="pref.email"
                (change)="toggle(pref.id, 'email')" />
            </div>
          </td>
          <td class="text-center">
            <div class="form-check d-flex justify-content-center">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="pref.inApp"
                (change)="toggle(pref.id, 'inApp')" />
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<button class="btn btn-primary mt-2">Save Preferences</button>
