<!--
  SETTINGS SHELL — demonstrates a SECOND-LEVEL router-outlet.

  The parent Shell (layout/shell) has a <router-outlet> where all
  protected feature pages render. This Settings Shell adds ANOTHER
  <router-outlet> one level deeper for its own sub-pages.

  Navigation tree:
    app-root
      └─ ShellComponent         ← <router-outlet> #1  (layout level)
           └─ SettingsShellComponent  ← <router-outlet> #2  (settings level)
                ├─ /settings/general
                ├─ /settings/profile
                ├─ /settings/security
                └─ /settings/notifications
-->
<div class="container-fluid py-2">

  <div class="mb-4">
    <h2 class="fw-bold mb-0">
      <i class="bi bi-gear-fill me-2 text-secondary"></i>Settings
    </h2>
    <p class="text-muted small mb-0">Manage your account and application preferences</p>
  </div>

  <div class="row g-4">

    <!-- Left tab navigation -->
    <div class="col-12 col-md-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-2">
          <ul class="nav flex-column gap-1">
            @for (tab of tabs; track tab.route) {
              <li class="nav-item">
                <a
                  [routerLink]="tab.route"
                  routerLinkActive="active bg-primary text-white"
                  class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2 text-dark">
                  <i [class]="'bi ' + tab.icon"></i>
                  {{ tab.label }}
                  <i class="bi bi-chevron-right ms-auto small opacity-50"></i>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>

    <!-- Right content — second-level router-outlet -->
    <!--
      Angular inserts the matched child component here.
      For /settings/general it renders GeneralSettingsComponent,
      for /settings/profile it renders ProfileSettingsComponent, etc.
      The SettingsShellComponent itself never unmounts — only the
      right panel content swaps on each tab click.
    -->
    <div class="col-12 col-md-9">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <router-outlet />
        </div>
      </div>
    </div>

  </div>
</div>
