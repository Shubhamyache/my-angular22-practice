<app-modal title="Crop Photo" size="sm" (closed)="cancel()">

  <div class="d-flex flex-column align-items-center">
    <div class="crop-frame" [style.width.px]="previewSize" [style.height.px]="previewSize">
      <canvas
        #previewCanvas
        [width]="previewSize"
        [height]="previewSize"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()"
        (pointerleave)="onPointerUp()">
      </canvas>
    </div>

    <div class="w-100 mt-3 d-flex align-items-center gap-2">
      <i class="bi bi-dash-lg text-muted"></i>
      <input
        type="range"
        class="form-range flex-grow-1"
        [min]="minScale"
        [max]="maxScale"
        step="0.05"
        [value]="scale()"
        (input)="onScaleChange($event)" />
      <i class="bi bi-plus-lg text-muted"></i>
    </div>
    <small class="text-muted mt-1">Drag the photo to reposition, use the slider to zoom</small>
  </div>

  <div modal-footer class="d-flex gap-2">
    <button type="button" class="btn btn-outline-secondary" [disabled]="saving()" (click)="cancel()">
      Cancel
    </button>
    <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="confirmCrop()">
      @if (saving()) {
        <span class="spinner-border spinner-border-sm me-2"></span>Processing…
      } @else {
        Use Photo
      }
    </button>
  </div>

</app-modal>
